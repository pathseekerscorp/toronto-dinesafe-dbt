version: 2

sources:
  - name: dinesafe
    description: >
      City of Toronto DineSafe food safety inspections, downloaded from the Open Data
      portal by scripts/download_dinesafe.py and loaded as text by scripts/load_dinesafe.py.
    schema: raw
    tables:
      - name: dinesafe
        description: >
          One row per infraction found during an inspection, across all downloaded snapshots.
          Inspections with no infractions have a single row with severity 'None'.
          See docs/data_profile.md for data quality notes.
        config:
          # The city refreshes the data daily; flag the load if the newest snapshot is stale.
          loaded_at_field: "_snapshot_date::timestamp"
          freshness:
            warn_after: {count: 3, period: day}
            error_after: {count: 14, period: day}
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [unique_id, _snapshot_date]
        columns:
          - name: unique_id
            description: Stable hash identifying an infraction row within a snapshot.
            data_tests:
              - not_null
          - name: estId
            description: >
              Establishment ID. Either a legacy numeric ID or an 18-character ID from the
              city's newer system.
            data_tests:
              - not_null
          - name: inspectionDate
            description: Inspection date (YYYY-MM-DD). Together with estId identifies an inspection.
            data_tests:
              - not_null
          - name: _id
            description: Row number within the snapshot. Not stable across snapshots.
          - name: oldEstId
            description: Legacy numeric establishment ID, or 'None'.
          - name: estName
            description: Establishment name.
          - name: address
            description: "Address as '<street> <unit> <postal code>', with 'None' for a missing unit or postal code."
          - name: inspectionStatus
            description: Pass, Conditional Pass, Closed or Temporarily Not Operating.
          - name: phone
            description: Phone number, or 'None' / '0000000000' when missing.
          - name: observation
            description: Summary sentence for the inspection. Often understates the worst infraction.
          - name: typeDesc
            description: Infraction description, or 'None' for a clean inspection.
          - name: deficiencyDesc
            description: Infraction category with its code prefix (e.g. '05.', '5C.', 'A.'), or 'None'.
          - name: severity
            description: "'M - Minor', 'S - Significant', 'C - Crucial', 'NA' (administrative) or 'None'."
          - name: OutcomeDate
            description: Court outcome date, if any.
          - name: OutcomeDesc
            description: Court outcome, or 'None'.
          - name: amountFined
            description: Fine in dollars, if any.
          - name: latitude
            description: Latitude.
          - name: longitude
            description: Longitude.
          - name: _snapshot_date
            description: Date the city last refreshed the snapshot this row came from.
          - name: _source_file
            description: Snapshot file the row was loaded from.
          - name: _loaded_at
            description: When scripts/load_dinesafe.py loaded the row.
