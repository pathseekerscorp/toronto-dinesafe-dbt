version: 2

models:
  - name: stg_dinesafe__inspection_records
    description: >
      Cleaned DineSafe records: one row per infraction found during an inspection, or a
      single row for an inspection with no infractions (is_infraction = false). Text
      placeholders ('None', zero phone numbers) are converted to nulls, columns are typed,
      the address is split into street, unit and postal code, and the latest snapshot of
      each record is kept. An inspection is identified by establishment_id + inspection_date.
    data_tests:
      - dbt_utils.expression_is_true:
          name: stg_records_severity_present_only_for_infractions
          arguments:
            expression: "(severity_code is null) = (not is_infraction)"
      - dbt_utils.expression_is_true:
          name: stg_records_administrative_category_matches_na_severity
          arguments:
            expression: "(infraction_category_scheme = 'administrative') = (severity_code = 'NA')"
          config:
            where: "is_infraction"
      - dbt_utils.expression_is_true:
          name: stg_records_inspection_not_after_snapshot
          arguments:
            expression: "inspection_date <= snapshot_date"
      - dbt_utils.expression_is_true:
          name: stg_records_fine_has_court_outcome
          arguments:
            expression: "amount_fined is null or outcome is not null"
      - dbt_utils.expression_is_true:
          name: stg_records_postal_code_is_toronto_format
          arguments:
            expression: "regexp_full_match(postal_code, 'M[0-9][A-Z] [0-9][A-Z][0-9]')"
      # Known source quirks: a few court outcomes are dated before the inspection, and
      # one conviction has no fine recorded. Warn rather than fail.
      - dbt_utils.expression_is_true:
          name: stg_records_outcome_not_before_inspection
          arguments:
            expression: "outcome_date >= inspection_date"
          config:
            severity: warn
      - dbt_utils.expression_is_true:
          name: stg_records_conviction_fined_has_amount
          arguments:
            expression: "amount_fined is not null"
          config:
            where: "outcome = 'Conviction - Fined'"
            severity: warn
    columns:
      - name: record_id
        description: Unique ID of the record (source unique_id).
        data_tests:
          - unique
          - not_null
      - name: establishment_id
        description: >
          Establishment ID as published. Legacy numeric IDs and the city's newer
          18-character IDs both appear; the same restaurant can have one of each.
        data_tests:
          - not_null
      - name: legacy_establishment_id
        description: >
          Legacy numeric ID. For new-format establishments this links back to the
          establishment's old ID, where one exists.
      - name: is_legacy_establishment_id
        description: True when establishment_id is a legacy numeric ID.
      - name: establishment_name
        description: "{{ doc('col_establishment_name') }}"
        data_tests:
          - not_null
      - name: address
        description: "{{ doc('col_address') }}"
      - name: street_address
        description: "{{ doc('col_street_address') }}"
      - name: unit
        description: "{{ doc('col_unit') }}"
      - name: postal_code
        description: "{{ doc('col_postal_code') }}"
      - name: forward_sortation_area
        description: "{{ doc('col_forward_sortation_area') }}"
      - name: phone
        description: "{{ doc('col_phone') }}"
      - name: latitude
        description: "{{ doc('col_latitude') }}"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 43.55
                max_value: 43.86
      - name: longitude
        description: "{{ doc('col_longitude') }}"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: -79.65
                max_value: -79.10
      - name: inspection_date
        description: "{{ doc('col_inspection_date') }}"
        data_tests:
          - not_null
      - name: inspection_status
        description: "{{ doc('col_inspection_status') }}"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Pass', 'Conditional Pass', 'Closed', 'Temporarily Not Operating']
      - name: inspection_summary
        description: "{{ doc('col_inspection_summary') }}"
      - name: is_infraction
        description: "{{ doc('col_is_infraction') }}"
      - name: infraction_description
        description: "{{ doc('col_infraction_description') }}"
      - name: infraction_category_code
        description: "{{ doc('col_infraction_category_code') }}"
      - name: infraction_category
        description: "{{ doc('col_infraction_category') }}"
      - name: infraction_category_scheme
        description: "{{ doc('col_infraction_category_scheme') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: ['current', 'legacy', 'administrative']
      - name: severity_code
        description: "{{ doc('col_severity_code') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: ['M', 'S', 'C', 'NA']
      - name: severity
        description: "{{ doc('col_severity') }}"
      - name: outcome_date
        description: "{{ doc('col_outcome_date') }}"
      - name: outcome
        description: "{{ doc('col_outcome') }}"
      - name: amount_fined
        description: "{{ doc('col_amount_fined') }}"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: snapshot_date
        description: "{{ doc('col_snapshot_date') }}"
      - name: loaded_at
        description: "{{ doc('col_loaded_at') }}"
