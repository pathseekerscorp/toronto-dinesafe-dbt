name: 'dinesafe'
version: '1.0.0'

profile: 'dinesafe'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Staging and intermediate models are lightweight views over the raw data;
# marts are tables because they're what analysis and dashboards query.
# Each layer gets its own DuckDB schema (staging, intermediate, marts).
models:
  dinesafe:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

# Save the rows behind any failing or warning test to the test_failures schema,
# so they can be queried directly (one table per test).
data_tests:
  dinesafe:
    +store_failures: true
    +schema: test_failures
